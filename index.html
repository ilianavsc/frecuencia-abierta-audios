<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>De la antena al streaming · Guion con audio</title>
<style>
  :root{
    --bg:#0d1014; --panel:#151a21; --panel2:#1b222c; --line:#232c38;
    --text:#e6ebf2; --muted:#8b9bb0;
    --andrea:#38d6c4; --iliana:#c07bf5; --ambas:#ffb454;
    --ok:#3ddc84; --danger:#ff6b6b; --accent:#4da3ff;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
    line-height:1.5;
  }

  /* ---------- Barra superior ---------- */
  .toolbar{
    position:sticky; top:0; z-index:50;
    display:flex; flex-wrap:wrap; gap:12px 20px; align-items:center;
    padding:12px 20px; background:rgba(13,16,20,.94);
    border-bottom:1px solid var(--line); backdrop-filter:blur(8px);
  }
  .toolbar-info strong{display:block; font-size:15px; letter-spacing:.3px}
  .toolbar-info .sub{font-size:12px; color:var(--muted)}
  .toolbar-stats{font-size:12px; color:var(--muted); margin-left:auto}
  .toolbar-actions{display:flex; gap:8px; flex-wrap:wrap}

  .btn{
    font:inherit; font-size:13px; font-weight:600; cursor:pointer;
    border-radius:9px; padding:9px 14px; border:1px solid var(--line);
    background:var(--panel2); color:var(--text); transition:.15s;
    white-space:nowrap;
  }
  .btn:hover:not(:disabled){background:#28323f; border-color:#3a4757}
  .btn:disabled{opacity:.38; cursor:not-allowed}
  .btn-primary{background:linear-gradient(135deg,#2f8fff,#6f5bff); border:none; color:#fff}
  .btn-primary:hover:not(:disabled){filter:brightness(1.12)}
  .btn-ghost{background:transparent; color:var(--muted)}
  .btn-ghost:hover:not(:disabled){color:var(--danger); border-color:var(--danger)}

  .progress{height:3px; background:var(--line); position:sticky; top:63px; z-index:49; display:none}
  .progress.on{display:block}
  .progress-bar{height:100%; width:0; background:linear-gradient(90deg,#2f8fff,#6f5bff); transition:width .2s}

  /* ---------- Secciones ---------- */
  main{max-width:1180px; margin:0 auto; padding:26px 18px 80px}
  .slide{
    background:var(--panel); border:1px solid var(--line);
    border-radius:16px; margin-bottom:22px; overflow:hidden;
  }
  .slide-head{
    display:flex; flex-wrap:wrap; gap:12px; justify-content:space-between;
    align-items:center; padding:16px 20px;
    background:linear-gradient(180deg,#1a212b,#151a21);
    border-bottom:1px solid var(--line);
  }
  .slide-tag{
    display:inline-block; font-size:11px; font-weight:700; letter-spacing:1.2px;
    text-transform:uppercase; color:var(--accent);
  }
  .slide-nota{margin:4px 0 0; font-size:12.5px; color:var(--muted); font-style:italic}
  .slide-actions{display:flex; align-items:center; gap:10px}
  .slide-status{font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums}
  .slide-status.full{color:var(--ok)}

  /* ---------- Líneas ---------- */
  .lines{padding:6px 0}
  .line{
    display:grid; grid-template-columns:96px 1fr 290px;
    gap:14px; align-items:start;
    padding:12px 20px; border-bottom:1px solid rgba(35,44,56,.55);
  }
  .line:last-child{border-bottom:none}
  .line.loaded{background:rgba(61,220,132,.035)}

  .who{
    font-size:11px; font-weight:800; letter-spacing:1px;
    padding-top:4px; text-transform:uppercase;
  }
  .line-andrea .who{color:var(--andrea)}
  .line-iliana .who{color:var(--iliana)}
  .line-ambas  .who{color:var(--ambas)}

  .what{font-size:15px; padding-top:1px}

  .audio-cell{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
  .btn-file{
    font-size:12px; font-weight:600; padding:7px 11px; border-radius:8px;
    border:1px dashed #3a4757; background:transparent; color:var(--muted);
    cursor:pointer; white-space:nowrap; transition:.15s;
  }
  .btn-file:hover{color:var(--text); border-color:var(--accent); background:rgba(77,163,255,.08)}
  .loaded .btn-file{border-style:solid; color:var(--ok); border-color:rgba(61,220,132,.5)}

  .file-info{font-size:11.5px; color:var(--muted); max-width:130px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .dur{font-size:11.5px; color:var(--ok); font-variant-numeric:tabular-nums}
  .err{font-size:11.5px; color:var(--danger)}

  .btn-icon{
    width:28px; height:28px; border-radius:50%; border:1px solid var(--line);
    background:var(--panel2); color:var(--text); cursor:pointer;
    display:grid; place-items:center; font-size:11px; padding:0; transition:.15s;
  }
  .btn-icon:hover{background:#28323f}
  .btn-icon.del:hover{color:var(--danger); border-color:var(--danger)}

  .nota{
    padding:10px 20px; font-size:13px; font-style:italic; color:#6f7f94;
    text-align:center; border-bottom:1px solid rgba(35,44,56,.55);
    background:rgba(255,255,255,.012);
  }

  footer{max-width:1180px; margin:0 auto; padding:0 18px 50px; font-size:12px; color:#5e6d80}

  @media (max-width:860px){
    .line{grid-template-columns:1fr; gap:8px; padding:14px 16px}
    .who{padding-top:0}
    .audio-cell{margin-top:2px}
    .toolbar-stats{margin-left:0; width:100%; order:3}
  }
</style>
</head>
<body>

<div class="toolbar">

    <strong>🎙️ Frecuencia Abierta</strong>

</div>

<script>
/* =========================================================
   1. GUION
   ========================================================= */
const GUION = [
  {tipo:"slide", titulo:"Diapositiva 1 · Arranque", nota:"Estática de un televisor antiguo. Entra la música y baja suavemente."},
  {tipo:"linea", hablante:"ANDREA", texto:"¡Hola, hola! Bienvenidos a Frecuencia Abierta, el podcast donde hablamos de tecnología sin que duela la cabeza. Soy Andrea Ferrer, y hoy traemos un viaje fascinante por la evolución de la pantalla."},
  {tipo:"linea", hablante:"ILIANA", texto:"Y yo soy Iliana Semprún. Hoy vengo con las preguntas que ustedes harían… y alguna que otra curiosidad. Andrea, ¿te acuerdas de cuando había que mover la antena para quitar la nieve de la pantalla? Siempre había alguien haciendo una pose rarísima con el brazo en alto para que se pudiera ver el partido."},
  {tipo:"linea", hablante:"ANDREA", texto:"¡Y funcionaba! La ciencia del pulso exacto: movías un centímetro y aparecía la imagen, movías otro y la perdías. Hoy vemos series en el celular o en el bus, sin antena y sin nieve. Pero llegar hasta aquí no fue magia: fue un montón de gente probando, equivocándose y volviendo a intentar. Y hoy vamos a contar esa historia sin siglas, sin tecnicismos y sin dolor de cabeza."},

  {tipo:"slide", titulo:"Diapositiva 2 · El mapa del episodio", nota:"Música de fondo suave."},
  {tipo:"linea", hablante:"ILIANA", texto:"¿Y cómo vamos a ordenar este viaje en el tiempo para no perdernos?"},
  {tipo:"linea", hablante:"ANDREA", texto:"En tres paradas muy claras. Primero, la televisión de antes: la de tubo catódico, la de la antena y la nieve. Después, el gran salto: el momento en que la imagen dejó de ser una onda continua y se convirtió en algo que se podía guardar, copiar y enviar sin perder calidad. Y al final, la televisión digital que todavía hoy nos llega por el aire, gratis, con una antena."},
  {tipo:"linea", hablante:"ILIANA", texto:"Me parece un plan perfecto. Prometemos explicar cada etapa con analogías sencillas y cotidianas. ¿Listos? Agarren su control remoto, que empezamos."},
  {tipo:"nota", texto:"Clic de control remoto. Transición musical corta."},

  {tipo:"slide", titulo:"Diapositiva 3 · El pintor invisible", nota:"Estática suave de fondo."},
  {tipo:"linea", hablante:"ILIANA", texto:"Empecemos por lo básico, Andrea. Para los que no vivieron esa época o nunca se lo preguntaron: ¿cómo hacía un televisor viejo de tubo para dibujar una imagen en la pantalla?"},
  {tipo:"linea", hablante:"ANDREA", texto:"Imagina a alguien pintando una pared con una brocha diminuta y ultra rápida. Va línea por línea, de izquierda a derecha y de arriba hacia abajo. Lo hace a tal velocidad que el ojo humano no ve la brocha, sino la pared completa pintada al instante. Y para que no parpadeara, pintaba primero unas cuantas líneas dejando un hueco, y luego volvía a rellenar los espacios vacíos."},
  {tipo:"linea", hablante:"ILIANA", texto:"¡Claro, como barrer una habitación grande por partes! Y por eso los televisores antiguos tenían esas características rayitas horizontales cuando te acercabas mucho, o la famosa nieve cuando la señal no llegaba con claridad."},

  {tipo:"slide", titulo:"Diapositiva 4 · La nieve y el papel aluminio"},
  {tipo:"linea", hablante:"ILIANA", texto:"Hablemos de esa nieve, porque era el enemigo público número uno de cualquier casa. Mi abuela, por ejemplo, tenía la antena forrada con bolitas de papel aluminio para captar mejor los canales."},
  {tipo:"linea", hablante:"ANDREA", texto:"¡Todos tuvimos la antena con papel aluminio! Era el truco casero por excelencia. La nieve era simplemente la señal avisando que no estaba llegando con suficiente fuerza. Y cuando había tormenta, o se iba la imagen por completo, o pasaba algo peor: se descalabraba el color y de repente el presentador del noticiero tenía la cara completamente verde."},
  {tipo:"linea", hablante:"ILIANA", texto:"¡La mítica perilla del tinte! Había que girarla con precisión quirúrgica para rescatar a la gente del color equivocado. Y lo más curioso es que no era culpa del televisor, sino de que cada país inventó su propia forma de transmitir el color y no se hablaban entre sí."},

  {tipo:"slide", titulo:"Diapositiva 5 · El problema de los idiomas"},
  {tipo:"linea", hablante:"ANDREA", texto:"Ahí está el primer gran dilema de esta historia: la falta de un idioma universal. Imagina el problema de los enchufes eléctricos cuando viajas al extranjero, pero multiplicado por diez. Aquí no bastaba con un simple adaptador; una cinta de video grabada en un país directamente no se podía reproducir en otro porque hablaban formatos completamente incompatibles."},
  {tipo:"linea", hablante:"ILIANA", texto:"Es como una orquesta donde cada músico decide afinar su instrumento con una escala diferente: por separado suenan de maravilla, pero cuando intentan tocar juntos se arma un caos absoluto. ¿Por qué no se pusieron de acuerdo desde el inicio?"},
  {tipo:"linea", hablante:"ANDREA", texto:"Porque cada potencia empezó a construir su infraestructura por su cuenta. Cuando quisieron estandarizar, ya cada quien tenía millones de televisores instalados en los hogares de sus ciudadanos. Y así vivimos décadas: con sistemas incompatibles y familias enteras peleando con las perillas de sintonía."},

  {tipo:"slide", titulo:"Diapositiva 6 · Un mundo dividido"},
  {tipo:"linea", hablante:"ILIANA", texto:"Y esa división técnica se convirtió en un mapa geopolítico de la televisión en todo el mundo, ¿cierto?"},
  {tipo:"linea", hablante:"ANDREA", texto:"Totalmente. En América se usó un estándar, en casi toda Europa otro, y Francia inventó un tercero. Si te mudabas de continente, tu televisor quedaba inservible o mudo. Los técnicos tenían que aprender casi tres oficios distintos, y los convertidores de señal eran aparatos gigantescos, carísimos y que a menudo arruinaban los colores en la traducción."},
  {tipo:"linea", hablante:"ILIANA", texto:"Como cuando traduces un chiste a otro idioma y pierde toda la gracia en el camino. Al menos nos quedaron las anécdotas de las antenas, los cables improvisados y el vecino misterioso que lograba tener la imagen perfecta sin decirle a nadie su truco."},
  {tipo:"nota", texto:"Clic de control remoto."},

  {tipo:"slide", titulo:"Diapositiva 7 · El gran cambio", nota:"Efecto digital breve."},
  {tipo:"linea", hablante:"ANDREA", texto:"Y entonces ocurrió la mayor revolución en la historia audiovisual: el momento en que la imagen dejó de ser una onda continua y se convirtió en una lista de números. Pura información binaria."},
  {tipo:"linea", hablante:"ILIANA", texto:"¿Y por qué transformar la luz y el color en una simple lista de números lo cambió absolutamente todo?"},
  {tipo:"linea", hablante:"ANDREA", texto:"Porque lo que se puede contar en números, se puede copiar de forma idéntica sin que se gaste jamás. Es como una receta de cocina: la primera vez la diseñas, pero luego solo la replicas al pie de la letra. Antes, cada copia de una cinta analógica perdía calidad, como la fotocopia de una fotocopia. El mundo digital eliminó esa degradación para siempre: hoy puedes ver una película mil veces y se verá idéntica a la primera."},

  {tipo:"slide", titulo:"Diapositiva 8 · La maleta"},
  {tipo:"linea", hablante:"ILIANA", texto:"Pero me imagino que convertir una imagen en millones de números crea archivos gigantescos, ¿no? Si la lista es tan descomunal, ¿cómo hacían para transmitirla y guardarla?"},
  {tipo:"linea", hablante:"ANDREA", texto:"Ese era el gran cuello de botella: una imagen digital cruda ocupaba demasiado espacio para los discos y cables de la época. La solución fue la compresión, que no es más que el arte de guardar solo lo verdaderamente importante. Es exactamente igual a empacar una maleta: en vez de meter la ropa desordenada ocupando todo el volumen, encuentras la manera de doblarla de forma inteligente para que quepa en un espacio mínimo sin perder nada."},

  {tipo:"slide", titulo:"Diapositiva 9 · El noticiero"},
  {tipo:"linea", hablante:"ILIANA", texto:"Ponme un ejemplo práctico de cómo funciona esa compresión inteligente, porque suena a magia pura."},
  {tipo:"linea", hablante:"ANDREA", texto:"Piensa en el presentador de un noticiero: él habla, gesticula y parpadea, pero la pared y el fondo detrás de él no se mueven ni un milímetro. En lugar de guardar el fondo completo treinta veces por segundo, el sistema guarda el fondo una sola vez y luego únicamente registra los pequeños cambios de sus labios y ojos. Gracias a esa genialidad, videos que antes requerían un camión de datos ahora caben en una pequeña memoria."},
  {tipo:"linea", hablante:"ILIANA", texto:"¡Por eso pudimos empezar a enviar videos por internet y ver contenidos en alta definición desde cualquier lugar! Pasamos de esperar horas o días descargando un solo archivo a reproducir películas enteras en segundos directamente desde el teléfono."},
  {tipo:"nota", texto:"Clic de control remoto."},

  {tipo:"slide", titulo:"Diapositiva 10 · La cajita", nota:"Cortina musical breve."},
  {tipo:"linea", hablante:"ILIANA", texto:"Y con toda esta tecnología digital llegamos a la televisión que todavía hoy recibimos por el aire, gratis, con una simple antena. La que nos salva la vida cuando se cae la conexión de internet o el cable."},
  {tipo:"linea", hablante:"ANDREA", texto:"Así es: la televisión digital abierta. Pero para que funcionara en los hogares sin obligar a todo el planeta a tirar sus televisores a la basura de golpe, se inventó un intermediario clave: el decodificador, la famosa cajita. Su misión era recibir la señal digital moderna y traducirla en tiempo real al lenguaje analógico que entendía el televisor viejo."},
  {tipo:"linea", hablante:"ILIANA", texto:"¡Un auténtico traductor de bolsillo que todo el mundo tuvo en su sala! Aunque, conociendo la historia, me imagino que los países tampoco se pusieron de acuerdo en un único estándar digital."},

  {tipo:"slide", titulo:"Diapositiva 11 · El reparto del mundo"},
  {tipo:"linea", hablante:"ANDREA", texto:"Efectivamente, la historia se repitió: Norteamérica adoptó una norma, Europa otra muy extendida, Japón desarrolló la suya y China creó su propio sistema. Cada región convenció a sus países vecinos y hoy todos esos estándares conviven en el planeta."},
  {tipo:"linea", hablante:"ILIANA", texto:"Es fascinante: no hubo un solo ganador tecnológico absoluto. Es exactamente como los idiomas: no hay uno que gane, simplemente usas el que habla tu comunidad."},

  {tipo:"slide", titulo:"Diapositiva 12 · La tele que ya no es un aparato"},
  {tipo:"linea", hablante:"ILIANA", texto:"Más allá de las normas técnicas, la televisión como concepto se transformó por completo, ¿verdad?"},
  {tipo:"linea", hablante:"ANDREA", texto:"Absolutamente. Dejó de ser un mueble estático en la sala para convertirse en un flujo de información portátil. Ya no estamos atados al horario de las ocho para ver nuestro programa favorito: ahora el contenido nos espera a nosotros, en el bolsillo, en la tableta o donde estemos. Y todo este ecosistema moderno de streaming empezó gracias a los que movían una antena en el techo buscando la mejor señal."},
  {tipo:"nota", texto:"Clic de control remoto."},

  {tipo:"slide", titulo:"Diapositiva 13 · Resumen", nota:"Música suave de fondo."},
  {tipo:"linea", hablante:"ILIANA", texto:"Hagamos un balance final, como los créditos de una buena película."},
  {tipo:"linea", hablante:"ANDREA", texto:"Arrancamos con la televisión analógica y sus perillas, donde cada región creó su estándar incomunicado. Luego el mundo digital convirtió la señal en números inmutables, y la compresión permitió meter ese torrente de datos en memorias portátiles y redes de internet. Finalmente, la televisión aérea se digitalizó con cajitas decodificadoras y múltiples estándares que hoy siguen conviviendo en armonía."},

  {tipo:"slide", titulo:"Diapositiva 14 · La gran lección"},
  {tipo:"linea", hablante:"ILIANA", texto:"¿Y cuál es la gran lección humana detrás de todo este recorrido tecnológico?"},
  {tipo:"linea", hablante:"ANDREA", texto:"Que la tecnología no avanza sola ni por arte de magia: avanza como avanzamos las personas, a través de acuerdos, desacuerdos, costumbres y soluciones ingeniosas a problemas cotidianos. Cada botón o estándar que hoy damos por sentado fue una decisión pensada por personas que buscaban conectarnos mejor."},
  {tipo:"linea", hablante:"ILIANA", texto:"Muchísimas gracias por acompañarnos en este recorrido de la antena al streaming. Yo soy Iliana Semprún…"},
  {tipo:"linea", hablante:"ANDREA", texto:"…y yo soy Andrea Ferrer. Esto fue Frecuencia Abierta."},
  {tipo:"linea", hablante:"AMBAS", texto:"¡Nos escuchamos en el próximo episodio!"},
  {tipo:"nota", texto:"Sube la cortina musical y se desvanece."}

/* =========================================================
   2. MODELO
   ========================================================= */
const SECCIONES = [];
(function construir(){
  let actual = null, n = 0;
  GUION.forEach(it => {
    if (it.tipo === "slide"){
      actual = { titulo: it.titulo, nota: it.nota || "", items: [] };
      SECCIONES.push(actual);
    } else if (actual){
      if (it.tipo === "linea") actual.items.push({ ...it, id: "L" + (n++) });
      else actual.items.push({ tipo:"nota", texto: it.texto });
    }
  });
})();

const TOTAL_LINEAS = SECCIONES.reduce((a,s)=> a + s.items.filter(i=>i.tipo==="linea").length, 0);

/* =========================================================
   3. RENDER
   ========================================================= */
const cont = document.getElementById("guion");

SECCIONES.forEach((sec, si) => {
  const el = document.createElement("section");
  el.className = "slide";
  el.dataset.slide = si;

  const head = document.createElement("div");
  head.className = "slide-head";
  head.innerHTML =
    '<div><span class="slide-tag">' + sec.titulo + '</span>' +
    (sec.nota ? '<p class="slide-nota">' + sec.nota + '</p>' : '') + '</div>' +
    '<div class="slide-actions">' +
      '<span class="slide-status" data-status>0 / 0</span>' +
      '<button class="btn btn-slide" data-dl disabled>⬇ Audio de la diapositiva</button>' +
    '</div>';
  el.appendChild(head);

  const lines = document.createElement("div");
  lines.className = "lines";

  sec.items.forEach(item => {
    if (item.tipo === "nota"){
      const n = document.createElement("div");
      n.className = "nota";
      n.textContent = "— " + item.texto + " —";
      lines.appendChild(n);
      return;
    }

    const row = document.createElement("div");
    row.className = "line line-" + item.hablante.toLowerCase();
    row.dataset.lineId = item.id;
    row.innerHTML =
      '<div class="who">' + item.hablante + '</div>' +
      '<div class="what">' + item.texto + '</div>' +
      '<div class="audio-cell">' +
        '<input type="file" accept="audio/*" id="f-' + item.id + '" hidden>' +
        '<label for="f-' + item.id + '" class="btn-file">🎤 Cargar audio</label>' +
        '<span class="file-info"></span>' +
        '<span class="dur"></span>' +
        '<button class="btn-icon play" hidden title="Escuchar">▶</button>' +
        '<button class="btn-icon del" hidden title="Quitar">✕</button>' +
      '</div>';
    lines.appendChild(row);
  });

  el.appendChild(lines);
  cont.appendChild(el);
});

/* =========================================================
   4. ESTADO DE AUDIO
   ========================================================= */
const AUDIO = new Map();       // id -> {file, name, url, duration}
let reproductor = null;

/* ---------- IndexedDB (persistencia) ---------- */
const DB_NAME = "frecuencia-abierta", STORE = "audios";
let dbPromise = null;

function openDB(){
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(STORE);
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  return dbPromise;
}
function idbPut(key, val){
  return openDB().then(db => new Promise((res, rej) => {
    const tx = db.transaction(STORE, "readwrite");
    tx.objectStore(STORE).put(val, key);
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
  }));
}
function idbDel(key){
  return openDB().then(db => new Promise((res, rej) => {
    const tx = db.transaction(STORE, "readwrite");
    tx.objectStore(STORE).delete(key);
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
  }));
}
function idbAll(){
  return openDB().then(db => new Promise((res, rej) => {
    const tx = db.transaction(STORE, "readonly");
    const st = tx.objectStore(STORE);
    const keysReq = st.getAllKeys();
    const valsReq = st.getAll();
    tx.oncomplete = () => res({ keys: keysReq.result, vals: valsReq.result });
    tx.onerror = () => rej(tx.error);
  }));
}

/* ---------- Contexto de audio ---------- */
let ctx = null;
function getCtx(){
  if (ctx) return ctx;
  const AC = window.AudioContext || window.webkitAudioContext;
  try { ctx = new AC({ sampleRate: 48000 }); }
  catch(e){ ctx = new AC(); }
  return ctx;
}

/* ---------- Utilidades ---------- */
function fmtTime(seg){
  if (!isFinite(seg)) return "";
  const m = Math.floor(seg / 60), s = Math.round(seg % 60);
  return m + ":" + String(s).padStart(2, "0");
}
function nombreSeguro(txt){
  return txt.toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/^-+|-+$/g, "");
}
function descargar(blob, nombre){
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = nombre;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
}

/* =========================================================
   5. CARGA DE AUDIO POR LÍNEA
   ========================================================= */
async function setAudio(id, blob, nombre, persistir){
  const row = document.querySelector('[data-line-id="' + id + '"]');
  if (!row) return;

  let dur = 0;
  try {
    const ab = await blob.arrayBuffer();
    const buf = await getCtx().decodeAudioData(ab);
    dur = buf.duration;
  } catch(e){
    const info = row.querySelector(".file-info");
    info.className = "err";
    info.textContent = "No se pudo leer este audio";
    return;
  }

  const prev = AUDIO.get(id);
  if (prev && prev.url) URL.revokeObjectURL(prev.url);

  AUDIO.set(id, { file: blob, name: nombre, url: URL.createObjectURL(blob), duration: dur });
  pintarFila(id);
  refrescarContadores();

  if (persistir !== false){
    try { await idbPut(id, { name: nombre, blob }); }
    catch(e){ console.warn("No se pudo guardar en el navegador", e); }
  }
}

function pintarFila(id){
  const row = document.querySelector('[data-line-id="' + id + '"]');
  if (!row) return;
  const a = AUDIO.get(id);
  const info = row.querySelector(".file-info");
  const lbl  = row.querySelector(".btn-file");
  const play = row.querySelector(".play");
  const del  = row.querySelector(".del");
  const dur  = row.querySelector(".dur");

  if (a){
    row.classList.add("loaded");
    info.className = "file-info";
    info.textContent = a.name.length > 20 ? a.name.slice(0, 17) + "…" : a.name;
    info.title = a.name;
    dur.textContent = fmtTime(a.duration);
    lbl.textContent = "🔄 Cambiar";
    play.hidden = false;
    del.hidden = false;
  } else {
    row.classList.remove("loaded");
    info.className = "file-info";
    info.textContent = "";
    info.title = "";
    dur.textContent = "";
    lbl.textContent = "🎤 Cargar audio";
    play.hidden = true;
    del.hidden = true;
  }
}

/* --- eventos de carga --- */
document.addEventListener("change", async (e) => {
  const input = e.target;
  if (!input.matches('input[type="file"]')) return;
  const id = input.id.slice(2);
  const file = input.files && input.files[0];
  input.value = "";
  if (!file) return;
  await setAudio(id, file, file.name, true);
});

/* --- play / borrar --- */
document.addEventListener("click", (e) => {
  const play = e.target.closest(".play");
  const del  = e.target.closest(".del");
  if (play){
    const id = play.closest("[data-line-id]").dataset.lineId;
    const a = AUDIO.get(id);
    if (!a) return;
    if (reproductor) { reproductor.pause(); }
    reproductor = new Audio(a.url);
    reproductor.play().catch(()=>{});
  }
  if (del){
    const id = del.closest("[data-line-id]").dataset.lineId;
    const a = AUDIO.get(id);
    if (a && a.url) URL.revokeObjectURL(a.url);
    AUDIO.delete(id);
    pintarFila(id);
    refrescarContadores();
    idbDel(id).catch(()=>{});
  }
});

/* =========================================================
   6. CONTADORES
   ========================================================= */
const statsEl = document.getElementById("stats");

function refrescarContadores(){
  // por sección
  document.querySelectorAll(".slide").forEach((el, si) => {
    const sec = SECCIONES[si];
    const ids = sec.items.filter(i => i.tipo === "linea").map(i => i.id);
    const listos = ids.filter(id => AUDIO.has(id)).length;
    const st = el.querySelector("[data-status]");
    const btn = el.querySelector("[data-dl]");
    st.textContent = listos + " / " + ids.length;
    st.classList.toggle("full", listos === ids.length && ids.length > 0);
    btn.disabled = listos === 0;
    btn.textContent = listos === ids.length && ids.length > 0
      ? "⬇ Descargar diapositiva"
      : "⬇ Descargar (" + listos + "/" + ids.length + ")";
  });

  // global
  const hechas = [...AUDIO.keys()].length;
  statsEl.textContent = hechas + " de " + TOTAL_LINEAS + " líneas con audio";
}

/* =========================================================
   7. EXPORTACIÓN DE AUDIO (WAV)
   ========================================================= */
function encodeWAV(int16, canales, sampleRate){
  const dataSize = int16.length * 2;
  const buffer = new ArrayBuffer(44 + dataSize);
  const view = new DataView(buffer);
  const ws = (off, str) => { for (let i = 0; i < str.length; i++) view.setUint8(off + i, str.charCodeAt(i)); };

  ws(0, "RIFF");
  view.setUint32(4, 36 + dataSize, true);
  ws(8, "WAVE");
  ws(12, "fmt ");
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);
  view.setUint16(22, canales, true);
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate * canales * 2, true);
  view.setUint16(32, canales * 2, true);
  view.setUint16(34, 16, true);
  ws(36, "data");
  view.setUint32(40, dataSize, true);
  new Int16Array(buffer, 44).set(int16);
  return new Blob([buffer], { type: "audio/wav" });
}

const progressEl = document.getElementById("progress");
const progressBar = document.getElementById("progressBar");
let exportando = false;

function setProgreso(pct){
  progressEl.classList.toggle("on", pct !== null);
  progressBar.style.width = (pct === null ? 0 : pct) + "%";
}

/**
 * lista: [{ id, gapMs }]
 */
async function exportarAudio(lista, nombreArchivo, gapPorDefecto){
  if (exportando) return;

  const conAudio = lista.filter(x => AUDIO.has(x.id));
  if (conAudio.length === 0){
    alert("Todavía no hay ningún audio cargado en esta selección.");
    return;
  }
  const faltan = lista.length - conAudio.length;
  if (faltan > 0 && !confirm("Faltan " + faltan + " línea(s) por cargar.\n¿Descargar de todas formas con lo que hay?")){
    return;
  }

  exportando = true;
  setProgreso(1);
  bloquearBotones(true);

  try{
    const contexto = getCtx();
    const sr = contexto.sampleRate;
    const piezas = [];
    let maxCanales = 1;
    let totalFrames = 0;

    for (let i = 0; i < lista.length; i++){
      const item = lista[i];
      const entry = AUDIO.get(item.id);
      setProgreso(Math.round((i / lista.length) * 85));
      await new Promise(r => setTimeout(r, 0));
      if (!entry) continue;

      let buf;
      try{
        const ab = await entry.file.arrayBuffer();
        buf = await contexto.decodeAudioData(ab);
      } catch(err){
        console.warn("No se pudo decodificar", item.id, err);
        continue;
      }

      const ch = Math.min(2, buf.numberOfChannels) || 1;
      if (ch > maxCanales) maxCanales = ch;

      const frames = buf.length;
      const data = new Int16Array(frames * ch);
      for (let c = 0; c < ch; c++){
        const src = buf.getChannelData(c);
        for (let s = 0; s < frames; s++){
          let v = src[s];
          if (v > 1) v = 1; else if (v < -1) v = -1;
          data[s * ch + c] = v < 0 ? v * 0x8000 : v * 0x7FFF;
        }
      }

      const gapMs = (item.gapMs != null) ? item.gapMs : gapPorDefecto;
      const gapFrames = Math.round(sr * gapMs / 1000);

      piezas.push({ data, ch, frames, gapFrames });
      totalFrames += frames + gapFrames;
    }

    if (piezas.length === 0){
      alert("No se pudo procesar ningún audio. Revisa los archivos cargados.");
      return;
    }

    setProgreso(90);
    await new Promise(r => setTimeout(r, 0));

    const salida = new Int16Array(totalFrames * maxCanales);
    let frameOffset = 0;
    for (const p of piezas){
      if (p.ch === maxCanales){
        salida.set(p.data, frameOffset * maxCanales);
      } else if (p.ch === 1 && maxCanales === 2){
        for (let s = 0; s < p.frames; s++){
          const v = p.data[s];
          const j = (frameOffset + s) * 2;
          salida[j] = v;
          salida[j + 1] = v;
        }
      }
      frameOffset += p.frames + p.gapFrames;
    }

    setProgreso(97);
    await new Promise(r => setTimeout(r, 0));

    const wav = encodeWAV(salida, maxCanales, sr);
    descargar(wav, nombreArchivo);

    setProgreso(100);
    setTimeout(() => setProgreso(null), 900);
  } catch(err){
    console.error(err);
    alert("Ocurrió un error al unir el audio: " + err.message);
    setProgreso(null);
  } finally {
    exportando = false;
    bloquearBotones(false);
  }
}

function bloquearBotones(estado){
  document.querySelectorAll(".btn-slide, #btn-episodio").forEach(b => {
    if (estado) b.disabled = true;
    else if (b.id === "btn-episodio") b.disabled = false;
    else refrescarContadores();
  });
}

/* --- descarga por diapositiva --- */
document.addEventListener("click", (e) => {
  const btn = e.target.closest(".btn-slide");
  if (!btn) return;
  const el = btn.closest(".slide");
  const si = Number(el.dataset.slide);
  const sec = SECCIONES[si];
  const ids = sec.items.filter(i => i.tipo === "linea").map(i => i.id);
  const lista = ids.map(id => ({ id, gapMs: 220 }));
  const nombre = "FA-" + String(si + 1).padStart(2, "0") + "-" + nombreSeguro(sec.titulo.replace(/^Diapositiva \d+ · /, "")) + ".wav";
  exportarAudio(lista, nombre, 220);
});

/* --- descarga del episodio completo --- */
document.getElementById("btn-episodio").addEventListener("click", () => {
  const lista = [];
  SECCIONES.forEach(sec => {
    const ids = sec.items.filter(i => i.tipo === "linea").map(i => i.id);
    ids.forEach((id, k) => {
      lista.push({ id, gapMs: (k === ids.length - 1) ? 800 : 220 });
    });
  });
  exportarAudio(lista, "Frecuencia-Abierta-De-la-antena-al-streaming.wav", 220);
});

/* --- borrar todo --- */
document.getElementById("btn-limpiar").addEventListener("click", async () => {
  if (!confirm("¿Borrar todos los audios cargados? Esta acción no se puede deshacer.")) return;
  [...AUDIO.entries()].forEach(([id, a]) => {
    if (a.url) URL.revokeObjectURL(a.url);
    pintarFila(id);
    idbDel(id).catch(()=>{});
  });
  AUDIO.clear();
  refrescarContadores();
});

/* =========================================================
   8. RESTAURAR AL CARGAR LA PÁGINA
   ========================================================= */
(async function restaurar(){
  refrescarContadores();
  try{
    const { keys, vals } = await idbAll();
    for (let i = 0; i < keys.length; i++){
      const v = vals[i];
      if (!v || !v.blob) continue;
      if (!document.querySelector('[data-line-id="' + keys[i] + '"]')) continue;
      await setAudio(keys[i], v.blob, v.name || "audio", false);
    }
  } catch(e){
    console.warn("No se pudo restaurar el audio guardado:", e);
  }
  refrescarContadores();
})();
</script>
