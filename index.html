<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frecuencia Abierta · Grabador de Guion</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root{
    --bg:#0f1217; --card:#181d24; --line:#262f3c; --text:#e6ebf2; --muted:#8b9bb0;
    --andrea:#38d6c4; --iliana:#c07bf5; --ambas:#ffb454; --ok:#3ddc84; --danger:#ff5252; --accent:#3b82f6;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  body{background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,sans-serif; line-height:1.5}
  
  /* Barra superior */
  header{
    position:sticky; top:0; z-index:100; background:rgba(15,18,23,.95); backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line); padding:12px 20px; display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between;
  }
  .title strong{font-size:16px; display:block}
  .title span{font-size:12px; color:var(--muted)}
  .actions{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
  
  /* Botones generales */
  button, label.btn{
    font:inherit; font-size:13px; font-weight:600; padding:8px 14px; border-radius:8px; cursor:pointer;
    border:1px solid var(--line); background:#202731; color:var(--text); display:inline-flex; align-items:center; gap:6px;
    text-decoration:none; transition:.15s;
  }
  button:hover, label.btn:hover{background:#2b3442; border-color:#3e4c60}
  .btn-primary{background:linear-gradient(135deg,#2563eb,#4f46e5); border:none; color:#fff}
  .btn-primary:hover{filter:brightness(1.15)}
  .btn-ghost{background:transparent; border-color:transparent; color:var(--muted)}
  .btn-ghost:hover{color:var(--danger)}
  
  /* Contenedor principal */
  main{max-width:1050px; margin:0 auto; padding:24px 16px 80px}
  .slide{background:var(--card); border:1px solid var(--line); border-radius:14px; margin-bottom:20px; overflow:hidden}
  .slide-header{
    background:#1d232c; padding:12px 18px; border-bottom:1px solid var(--line);
    display:flex; justify-content:space-between; align-items:center; font-size:13px; font-weight:700; color:var(--accent);
  }
  .slide-header span.status{font-size:12px; font-weight:500; color:var(--muted)}
  .slide-header span.status.done{color:var(--ok)}

  /* Líneas de diálogo */
  .line{display:grid; grid-template-columns:90px 1fr auto; gap:16px; align-items:center; padding:14px 18px; border-bottom:1px solid rgba(38,47,60,.5)}
  .line:last-child{border-bottom:none}
  .line.has-audio{background:rgba(61,220,132,.03)}
  
  .who{font-size:11px; font-weight:800; letter-spacing:1px; text-transform:uppercase}
  .who.andrea{color:var(--andrea)}
  .who.iliana{color:var(--iliana)}
  .who.ambas{color:var(--ambas)}
  .text{font-size:14.5px}

  /* Controles de audio */
  .controls{display:flex; align-items:center; gap:8px}
  .btn-rec{background:rgba(255,82,82,.12); border-color:#ff5252; color:#ff5252}
  .btn-rec:hover{background:rgba(255,82,82,.25); color:#fff}
  .btn-rec.recording{background:#dc2626; color:#fff; animation:pulse 1s infinite}
  @keyframes pulse{0%,100%{opacity:1} 50%{opacity:.7}}
  
  .has-audio .btn-rec{background:#202731; border-color:var(--line); color:var(--muted); font-weight:500}
  .has-audio .btn-rec:hover{color:var(--text); border-color:#3e4c60}

  .btn-circle{width:32px; height:32px; border-radius:50%; padding:0; justify-content:center}
  .dur{font-size:11px; color:var(--ok); font-weight:600; min-width:34px; text-align:right}

  .nota{padding:10px 18px; font-size:12.5px; font-style:italic; color:#78889b; background:rgba(255,255,255,.01); text-align:center}
  
  /* Zona drag & drop */
  .drop-zone{
    border:2px dashed var(--line); border-radius:12px; padding:20px; text-align:center;
    margin-bottom:24px; color:var(--muted); font-size:13px; background:rgba(24,29,36,.5); transition:.2s;
  }
  .drop-zone.dragover{border-color:var(--accent); background:rgba(59,130,246,.08); color:var(--text)}

  @media(max-width:768px){
    .line{grid-template-columns:1fr; gap:10px}
    .controls{justify-content:flex-start}
  }
</style>
</head>
<body>

<header>
  <div class="title">
    <strong>🎙️ Frecuencia Abierta</strong>
    <span id="global-stats">0 de 40 audios listos</span>
  </div>
  <div class="actions">
    <input type="file" id="file-input" multiple accept="audio/*,.zip" hidden>
    <label for="file-input" class="btn" title="Cargar audios o archivo .zip">📥 Cargar audios / .zip</label>
    <button id="btn-zip" title="Descargar todas las tomas en un .zip para enviárselo a tu compañera">📦 Descargar paquete (.zip)</button>
    <button id="btn-wav" class="btn-primary">⬇ Descargar episodio (WAV)</button>
    <button id="btn-clear" class="btn-ghost" title="Borrar todas las grabaciones locales">🗑</button>
  </div>
</header>

<main>
  <div class="drop-zone" id="drop-zone">
    💡 <strong>Tip rápido:</strong> Puedes arrastrar y soltar aquí tus archivos de audio o el <strong>.zip</strong> de tu compañera para cargarlos automáticamente.
  </div>
  <div id="slides-container"></div>
</main>

<script>
/* 1. GUION */
const GUION = [
  {tipo:"slide", titulo:"Diapositiva 1 · Arranque"},
  {tipo:"linea", hablante:"ANDREA", texto:"¡Hola, hola! Bienvenidos a Frecuencia Abierta, el podcast donde hablamos de tecnología sin que duela la cabeza. Soy Andrea Ferrer, y hoy traemos un viaje fascinante por la evolución de la pantalla."},
  {tipo:"linea", hablante:"ILIANA", texto:"Y yo soy Iliana Semprún. Hoy vengo con las preguntas que ustedes harían… y alguna que otra curiosidad. Andrea, ¿te acuerdas de cuando había que mover la antena para quitar la nieve de la pantalla? Siempre había alguien haciendo una pose rarísima con el brazo en alto para que se pudiera ver el partido."},
  {tipo:"linea", hablante:"ANDREA", texto:"¡Y funcionaba! La ciencia del pulso exacto: movías un centímetro y aparecía la imagen, movías otro y la perdías. Hoy vemos series en el celular o en el bus, sin antena y sin nieve. Pero llegar hasta aquí no fue magia: fue un montón de gente probando, equivocándose y volviendo a intentar. Y hoy vamos a contar esa historia sin siglas, sin tecnicismos y sin dolor de cabeza."},

  {tipo:"slide", titulo:"Diapositiva 2 · El mapa del episodio"},
  {tipo:"linea", hablante:"ILIANA", texto:"¿Y cómo vamos a ordenar este viaje en el tiempo para no perdernos?"},
  {tipo:"linea", hablante:"ANDREA", texto:"En tres paradas muy claras. Primero, la televisión de antes: la de tubo catódico, la de la antena y la nieve. Después, el gran salto: el momento en que la imagen dejó de ser una onda continua y se convirtió en algo que se podía guardar, copiar y enviar sin perder calidad. Y al final, la televisión digital que todavía hoy nos llega por el aire, gratis, con una antena."},
  {tipo:"linea", hablante:"ILIANA", texto:"Me parece un plan perfecto. Prometemos explicar cada etapa con analogías sencillas y cotidianas. ¿Listos? Agarren su control remoto, que empezamos."},
  {tipo:"nota", texto:"Clic de control remoto. Transición musical corta."},

  {tipo:"slide", titulo:"Diapositiva 3 · El pintor invisible"},
  {tipo:"linea", hablante:"ILIANA", texto:"Empecemos por lo básico, Andrea. Para los que no vivieron esa época o nunca se lo preguntaron: ¿cómo hacía un televisor viejo de tubo para dibujar una imagen en la pantalla?"},
  {tipo:"linea", hablante:"ANDREA", texto:"Imagina a alguien pintando una pared con una brocha diminuta y ultra rápida. Va línea por línea, de izquierda a derecha y de arriba hacia abajo. Lo hace a tal velocidad que el ojo humano no ve la brocha, sino la pared completa pintada al instante. Y para que no parpadeara, pintaba primero unas cuantas líneas dejando un hueco, y luego volvía a rellenar los espacios vacíos."},
  {tipo:"linea", hablante:"ILIANA", texto:"¡Claro, como barrer una habitación grande por partes! Y por eso los televisores antiguos tenían esas características rayitas horizontales cuando te acercabas mucho, o la famosa nieve cuando la señal no llegaba con claridad."},

  {tipo:"slide", titulo:"Diapositiva 4 · La nieve y el papel aluminio"},
  {tipo:"linea", hablante:"ILIANA", texto:"Hablemos de esa nieve, porque era el enemigo público número uno de cualquier casa. Mi abuela, por ejemplo, tenía la antena forrada con bolitas de papel aluminio para captar mejor los canales."},
  {tipo:"linea", hablante:"ANDREA", texto:"¡Todos tuvimos la antena con papel aluminio! Era el truco casero por excelencia. La nieve era simplemente la señal avisando que no estaba llegando con suficiente fuerza. Y cuando había tormenta, o se iba la imagen por completo, o pasaba algo peor: se descalabraba el color y de repente el presentador del noticiero tenía la cara completamente verde."},
  {tipo:"linea", hablante:"ILIANA", texto:"¡La mítica perilla del tinte! Había que girarla con precisión quirúrgica para rescatar a la gente del color equivocado. Y lo más curioso es que no era culpa del televisor, sino de que cada país inventó su propia forma de transmitir el color y no se hablaban entre sí."},

  {tipo:"slide", titulo:"Diapositiva 5 · El problema de los idiomas"},
  {tipo:"linea", hablante:"ANDREA", texto:"Ahí está el primer gran dilema de esta historia: la falta de un idioma universal. Imagina el problema de los enchufes eléctricos cuando viajas al extranjero, pero multiplicado por diez. Aquí no bastaba con un simple adaptador; una cinta de video grabada en un país directamente no se podía reproducir en otro porque hablaban formatos completamente incompatibles."},
  {tipo:"linea", hablante:"ILIANA", texto:"Es como una orquesta donde cada músico decide afinar su instrumento con una escala diferente: por separado suenan de maravilla, pero cuando intentan tocar juntos se arma un caos absoluto. ¿Por qué no se pusieron de acuerdo desde el inicio?"},
  {tipo:"linea", hablante:"ANDREA", texto:"Porque cada potencia empezó a construir su infraestructura por su cuenta. Cuando quisieron estandarizar, ya cada quien tenía millones de televisores instalados en los hogares de sus ciudadanos. Y así vivimos décadas: con sistemas incompatibles y familias enteras peleando con las perillas de sintonía."},

  {tipo:"slide", titulo:"Diapositiva 6 · Un mundo dividido"},
  {tipo:"linea", hablante:"ILIANA", texto:"Y esa división técnica se convirtió en un mapa geopolítico de la televisión en todo el mundo, ¿cierto?"},
  {tipo:"linea", hablante:"ANDREA", texto:"Totalmente. En América se usó un estándar, en casi toda Europa otro, y Francia inventó un tercero. Si te mudabas de continente, tu televisor quedaba inservible o mudo. Los técnicos tenían que aprender casi tres oficios distintos, y los convertidores de señal eran aparatos gigantescos, carísimos y que a menudo arruinaban los colores en la traducción."},
  {tipo:"linea", hablante:"ILIANA", texto:"Como cuando traduces un chiste a otro idioma y pierde toda la gracia en el camino. Al menos nos quedaron las anécdotas de las antenas, los cables improvisados y el vecino misterioso que lograba tener la imagen perfecta sin decirle a nadie su truco."},
  {tipo:"nota", texto:"Clic de control remoto."},

  {tipo:"slide", titulo:"Diapositiva 7 · El gran cambio"},
  {tipo:"linea", hablante:"ANDREA", texto:"Y entonces ocurrió la mayor revolución en la historia audiovisual: el momento en que la imagen dejó de ser una onda continua y se convirtió en una lista de números. Pura información binaria."},
  {tipo:"linea", hablante:"ILIANA", texto:"¿Y por qué transformar la luz y el color en una simple lista de números lo cambió absolutamente todo?"},
  {tipo:"linea", hablante:"ANDREA", texto:"Porque lo que se puede contar en números, se puede copiar de forma idéntica sin que se gaste jamás. Es como una receta de cocina: la primera vez la diseñas, pero luego solo la replicas al pie de la letra. Antes, cada copia de una cinta analógica perdía calidad, como la fotocopia de una fotocopia. El mundo digital eliminó esa degradación para siempre: hoy puedes ver una película mil veces y se verá idéntica a la primera."},

  {tipo:"slide", titulo:"Diapositiva 8 · La maleta"},
  {tipo:"linea", hablante:"ILIANA", texto:"Pero me imagino que convertir una imagen en millones de números crea archivos gigantescos, ¿no? Si la lista es tan descomunal, ¿cómo hacían para transmitirla y guardarla?"},
  {tipo:"linea", hablante:"ANDREA", texto:"Ese era el gran cuello de botella: una imagen digital cruda ocupaba demasiado espacio para los discos y cables de la época. La solución fue la compresión, que no es más que el arte de guardar solo lo verdaderamente importante. Es exactamente igual a empacar una maleta: en vez de meter la ropa desordenada ocupando todo el volumen, encuentras la manera de doblarla de forma inteligente para que quepa en un espacio mínimo sin perder nada."},

  {tipo:"slide", titulo:"Diapositiva 9 · El noticiero"},
  {tipo:"linea", hablante:"ILIANA", texto:"Ponme un ejemplo práctico de cómo funciona esa compresión inteligente, porque suena a magia pura."},
  {tipo:"linea", hablante:"ANDREA", texto:"Piensa en el presentador de un noticiero: él habla, gesticula y parpadea, pero la pared y el fondo detrás de él no se mueven ni un milímetro. En lugar de guardar el fondo completo treinta veces por segundo, el sistema guarda el fondo una sola vez y luego únicamente registra los pequeños cambios de sus labios y ojos. Gracias a esa genialidad, videos que antes requerían un camión de datos ahora caben en una pequeña memoria."},
  {tipo:"linea", hablante:"ILIANA", texto:"¡Por eso pudimos empezar a enviar videos por internet y ver contenidos en alta definición desde cualquier lugar! Pasamos de esperar horas o días descargando un solo archivo a reproducir películas enteras en segundos directamente desde el teléfono."},
  {tipo:"nota", texto:"Clic de control remoto."},

  {tipo:"slide", titulo:"Diapositiva 10 · La cajita"},
  {tipo:"linea", hablante:"ILIANA", texto:"Y con toda esta tecnología digital llegamos a la televisión que todavía hoy recibimos por el aire, gratis, con una simple antena. La que nos salva la vida cuando se cae la conexión de internet o el cable."},
  {tipo:"linea", hablante:"ANDREA", texto:"Así es: la televisión digital abierta. Pero para que funcionara en los hogares sin obligar a todo el planeta a tirar sus televisores a la basura de golpe, se inventó un intermediario clave: el decodificador, la famosa cajita. Su misión era recibir la señal digital moderna y traducirla en tiempo real al lenguaje analógico que entendía el televisor viejo."},
  {tipo:"linea", hablante:"ILIANA", texto:"¡Un auténtico traductor de bolsillo que todo el mundo tuvo en su sala! Aunque, conociendo la historia, me imagino que los países tampoco se pusieron de acuerdo en un único estándar digital."},

  {tipo:"slide", titulo:"Diapositiva 11 · El reparto del mundo"},
  {tipo:"linea", hablante:"ANDREA", texto:"Efectivamente, la historia se repitió: Norteamérica adoptó una norma, Europa otra muy extendida, Japón desarrolló la suya y China creó su propio sistema. Cada región convenció a sus países vecinos y hoy todos esos estándares conviven en el planeta."},
  {tipo:"linea", hablante:"ILIANA", texto:"Es fascinante: no hubo un solo ganador tecnológico absoluto. Es exactamente como los idiomas: no hay uno que gane, simplemente usas el que habla tu comunidad."},

  {tipo:"slide", titulo:"Diapositiva 12 · La tele que ya no es un aparato"},
  {tipo:"linea", hablante:"ILIANA", texto:"Más allá de las normas técnicas, la televisión como concepto se transformó por completo, ¿verdad?"},
  {tipo:"linea", hablante:"ANDREA", texto:"Absolutamente. Dejó de ser un mueble estático en la sala para convertirse en un flujo de información portátil. Ya no estamos atados al horario de las ocho para ver nuestro programa favorito: ahora el contenido nos espera a nosotros, en el bolsillo, en la tableta o donde estemos. Y todo este ecosistema moderno de streaming empezó gracias a los que movían una antena en el techo buscando la mejor señal."},
  {tipo:"nota", texto:"Clic de control remoto."},

  {tipo:"slide", titulo:"Diapositiva 13 · Resumen"},
  {tipo:"linea", hablante:"ILIANA", texto:"Hagamos un balance final, como los créditos de una buena película."},
  {tipo:"linea", hablante:"ANDREA", texto:"Arrancamos con la televisión analógica y sus perillas, donde cada región creó su estándar incomunicado. Luego el mundo digital convirtió la señal en números inmutables, y la compresión permitió meter ese torrente de datos en memorias portátiles y redes de internet. Finalmente, la televisión aérea se digitalizó con cajitas decodificadoras y múltiples estándares que hoy siguen conviviendo en armonía."},

  {tipo:"slide", titulo:"Diapositiva 14 · La gran lección"},
  {tipo:"linea", hablante:"ILIANA", texto:"¿Y cuál es la gran lección humana detrás de todo este recorrido tecnológico?"},
  {tipo:"linea", hablante:"ANDREA", texto:"Que la tecnología no avanza sola ni por arte de magia: avanza como avanzamos las personas, a través de acuerdos, desacuerdos, costumbres y soluciones ingeniosas a problemas cotidianos. Cada botón o estándar que hoy damos por sentado fue una decisión pensada por personas que buscaban conectarnos mejor."},
  {tipo:"linea", hablante:"ILIANA", texto:"Muchísimas gracias por acompañarnos en este recorrido de la antena al streaming. Yo soy Iliana Semprún…"},
  {tipo:"linea", hablante:"ANDREA", texto:"…y yo soy Andrea Ferrer. Esto fue Frecuencia Abierta."},
  {tipo:"linea", hablante:"AMBAS", texto:"¡Nos escuchamos en el próximo episodio!"},
  {tipo:"nota", texto:"Sube la cortina musical y se desvanece."}
];

/* 2. CONSTRUCCIÓN DE LA ESTRUCTURA */
const SECCIONES = [];
let lineCount = 0;
let currentSlide = null;

GUION.forEach(it => {
  if (it.tipo === "slide"){
    currentSlide = { titulo: it.titulo, items: [] };
    SECCIONES.push(currentSlide);
  } else if (currentSlide){
    if (it.tipo === "linea") currentSlide.items.push({ ...it, id: "L" + (lineCount++) });
    else currentSlide.items.push(it);
  }
});

const TOTAL_LINEAS = lineCount;
const AUDIO = new Map(); // id -> { blob, duration, url }
let player = null, playingId = null;
let mediaRecorder = null, recLineId = null, recStartTime = 0, recTimer = null;

/* 3. STORAGE LOCAL (IndexedDB) */
function getDB(){
  return new Promise(res => {
    const r = indexedDB.open("FA_Audios", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("tomas");
    r.onsuccess = () => res(r.result);
  });
}
async function dbSave(id, blob, dur){
  const db = await getDB();
  const tx = db.transaction("tomas", "readwrite");
  tx.objectStore("tomas").put({ blob, dur }, id);
}
async function dbDelete(id){
  const db = await getDB();
  const tx = db.transaction("tomas", "readwrite");
  tx.objectStore("tomas").delete(id);
}
async function dbGetAll(){
  const db = await getDB();
  return new Promise(res => {
    const tx = db.transaction("tomas", "readonly");
    const st = tx.objectStore("tomas");
    const k = st.getAllKeys(), v = st.getAll();
    tx.oncomplete = () => res({ keys: k.result, vals: v.result });
  });
}

/* 4. RENDER */
const container = document.getElementById("slides-container");
SECCIONES.forEach((sec, sIdx) => {
  const card = document.createElement("div");
  card.className = "slide";
  card.dataset.slideIndex = sIdx;
  
  let linesHtml = "";
  sec.items.forEach(it => {
    if (it.tipo === "nota"){
      linesHtml += `<div class="nota">— ${it.texto} —</div>`;
      return;
    }
    linesHtml += `
      <div class="line" data-id="${it.id}">
        <div class="who ${it.hablante.toLowerCase()}">${it.hablante}</div>
        <div class="text">${it.texto}</div>
        <div class="controls">
          <button class="btn-rec" data-rec="${it.id}">⏺ Grabar</button>
          <button class="btn-circle play" data-play="${it.id}" style="display:none">▶</button>
          <span class="dur"></span>
          <button class="btn-circle del" data-del="${it.id}" style="display:none" title="Eliminar">✕</button>
        </div>
      </div>
    `;
  });

  card.innerHTML = `
    <div class="slide-header">
      <span>${sec.titulo}</span>
      <span class="status" data-slide-status>0 / ${sec.items.filter(i=>i.tipo==="linea").length}</span>
    </div>
    ${linesHtml}
  `;
  container.appendChild(card);
});

/* 5. GESTIÓN DE AUDIO */
function formatTime(s){
  if (!isFinite(s) || s <= 0) return "";
  const m = Math.floor(s / 60), sec = Math.floor(s % 60);
  return `${m}:${String(sec).padStart(2, '0')}`;
}

async function setAudio(id, blob, dur, save = true){
  const row = document.querySelector(`[data-id="${id}"]`);
  if (!row) return;

  const url = URL.createObjectURL(blob);
  AUDIO.set(id, { blob, dur, url });

  row.classList.add("has-audio");
  row.querySelector(".btn-rec").textContent = "🔄 Regrabar";
  row.querySelector(".play").style.display = "inline-flex";
  row.querySelector(".del").style.display = "inline-flex";
  row.querySelector(".dur").textContent = formatTime(dur);

  if (save) await dbSave(id, blob, dur);
  updateStats();
}

function removeAudio(id){
  const row = document.querySelector(`[data-id="${id}"]`);
  if (!row) return;
  if (playingId === id) stopPlay();
  
  const a = AUDIO.get(id);
  if (a) URL.revokeObjectURL(a.url);
  AUDIO.delete(id);

  row.classList.remove("has-audio");
  row.querySelector(".btn-rec").textContent = "⏺ Grabar";
  row.querySelector(".play").style.display = "none";
  row.querySelector(".del").style.display = "none";
  row.querySelector(".dur").textContent = "";

  dbDelete(id);
  updateStats();
}

function updateStats(){
  document.getElementById("global-stats").textContent = `${AUDIO.size} de ${TOTAL_LINEAS} audios listos`;
  SECCIONES.forEach((sec, idx) => {
    const card = document.querySelector(`[data-slide-index="${idx}"]`);
    const total = sec.items.filter(i => i.tipo === "linea").length;
    const ready = sec.items.filter(i => i.tipo === "linea" && AUDIO.has(i.id)).length;
    const st = card.querySelector("[data-slide-status]");
    st.textContent = `${ready} / ${total}`;
    st.classList.toggle("done", ready === total && total > 0);
  });
}

/* 6. GRABACIÓN */
async function startRecording(id){
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRecorder = new MediaRecorder(stream);
    recLineId = id;
    recStartTime = Date.now();
    const chunks = [];

    const row = document.querySelector(`[data-id="${id}"]`);
    const btn = row.querySelector(".btn-rec");
    btn.classList.add("recording");
    btn.textContent = "⏹ Detener (0:00)";

    recTimer = setInterval(() => {
      const elapsed = (Date.now() - recStartTime) / 1000;
      btn.textContent = `⏹ Detener (${formatTime(elapsed)})`;
    }, 250);

    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
    mediaRecorder.onstop = async () => {
      clearInterval(recTimer);
      const dur = Math.max(0.5, (Date.now() - recStartTime) / 1000);
      btn.classList.remove("recording");
      const blob = new Blob(chunks, { type: mediaRecorder.mimeType || "audio/webm" });
      stream.getTracks().forEach(t => t.stop());
      mediaRecorder = null;
      recLineId = null;
      await setAudio(id, blob, dur, true);
    };

    mediaRecorder.start();
  } catch(err){
    alert("No se pudo acceder al micrófono. Revisa los permisos de tu navegador.");
  }
}

function stopRecording(){
  if (mediaRecorder && mediaRecorder.state !== "inactive"){
    mediaRecorder.stop();
  }
}

/* 7. REPRODUCCIÓN */
function stopPlay(){
  if (player){ player.pause(); player = null; }
  if (playingId){
    const row = document.querySelector(`[data-id="${playingId}"]`);
    if (row) row.querySelector(".play").textContent = "▶";
    playingId = null;
  }
}

function playAudio(id){
  if (playingId === id){ stopPlay(); return; }
  stopPlay();
  const a = AUDIO.get(id);
  if (!a) return;

  player = new Audio(a.url);
  playingId = id;
  const row = document.querySelector(`[data-id="${id}"]`);
  row.querySelector(".play").textContent = "⏸";

  player.onended = stopPlay;
  player.onerror = stopPlay;
  player.play().catch(stopPlay);
}

/* 8. EVENTOS */
document.addEventListener("click", e => {
  const rec = e.target.closest("[data-rec]");
  const play = e.target.closest("[data-play]");
  const del = e.target.closest("[data-del]");

  if (rec){
    const id = rec.dataset.rec;
    if (recLineId === id) stopRecording();
    else {
      if (recLineId) stopRecording();
      stopPlay();
      startRecording(id);
    }
  } else if (play){
    playAudio(play.dataset.play);
  } else if (del){
    removeAudio(del.dataset.del);
  }
});

/* 9. IDENTIFICADOR FLEXIBLE DE LÍNEA */
function identifyLineId(filename){
  const clean = filename.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");

  // 1. Busca L0, L1, L02, L-0, L_12, etc.
  const mL = clean.match(/(?:^|[^a-z0-9])l[-_\s]*(\d+)(?:[^a-z0-9]|$)/);
  if (mL){
    const id = "L" + parseInt(mL[1], 10);
    if (document.querySelector(`[data-id="${id}"]`)) return id;
  }

  // 2. Busca por diapositiva y personaje: ej. "diapositiva 1 andrea", "d2_iliana"
  const mSlide = clean.match(/(?:diapositiva|slide|d)[-_\s]*(\d+)/);
  if (mSlide){
    const sIdx = parseInt(mSlide[1], 10) - 1;
    if (SECCIONES[sIdx]){
      const lines = SECCIONES[sIdx].items.filter(i => i.tipo === "linea");
      let who = "";
      if (clean.includes("andrea")) who = "ANDREA";
      else if (clean.includes("iliana")) who = "ILIANA";
      else if (clean.includes("ambas")) who = "AMBAS";

      if (who){
        const match = lines.find(i => i.hablante === who);
        if (match) return match.id;
      }
      if (lines.length === 1) return lines[0].id;
    }
  }

  // 3. Busca números solos: ej. "toma 0", "audio 5"
  const mNum = clean.match(/(?:toma|audio|voz|track)[-_\s]*(\d+)/);
  if (mNum){
    const id = "L" + parseInt(mNum[1], 10);
    if (document.querySelector(`[data-id="${id}"]`)) return id;
  }

  return null;
}

function getBlobDuration(blob){
  return new Promise(res => {
    try {
      const u = URL.createObjectURL(blob);
      const a = new Audio();
      a.preload = "metadata";
      a.onloadedmetadata = () => { URL.revokeObjectURL(u); res(isFinite(a.duration) ? a.duration : 1); };
      a.onerror = () => { URL.revokeObjectURL(u); res(1); };
      a.src = u;
      setTimeout(() => { URL.revokeObjectURL(u); res(1); }, 1500);
    } catch(e){
      res(1);
    }
  });
}

/* CARGAR ARCHIVOS Y ZIP */
async function loadFiles(fileList){
  const files = Array.from(fileList);
  if (!files.length) return;

  let loaded = 0;
  const unrecognized = [];

  for (const f of files){
    const isZip = f.name.toLowerCase().endsWith(".zip") || f.type.includes("zip");

    if (isZip){
      try {
        const zip = await JSZip.loadAsync(f);
        const entries = Object.values(zip.files).filter(e => !e.dir && !e.name.startsWith("__MACOSX") && !e.name.startsWith("."));
        for (const entry of entries){
          const fname = entry.name.split("/").pop();
          const id = identifyLineId(fname);
          if (id){
            const blob = await entry.async("blob");
            const dur = await getBlobDuration(blob);
            await setAudio(id, blob, dur, true);
            loaded++;
          } else if (fname && !fname.endsWith(".json") && !fname.endsWith(".txt")) {
            unrecognized.push(fname);
          }
        }
      } catch(err){
        console.error(err);
        alert("Error al leer el archivo ZIP: " + err.message);
      }
    } else {
      const id = identifyLineId(f.name);
      if (id){
        const dur = await getBlobDuration(f);
        await setAudio(id, f, dur, true);
        loaded++;
      } else {
        unrecognized.push(f.name);
      }
    }
  }

  if (loaded > 0){
    alert(`🎉 ¡Éxito! Se cargaron y sincronizaron ${loaded} audios en sus casillas.`);
  } else {
    alert("No se pudo reconocer a qué línea corresponden los archivos.\n\nAsegúrate de que los archivos contengan en su nombre 'L0', 'L1', 'L2', etc.");
  }
}

// Evento selector de archivos
const fileInput = document.getElementById("file-input");
fileInput.addEventListener("change", async e => {
  if (e.target.files && e.target.files.length){
    await loadFiles(e.target.files);
    e.target.value = "";
  }
});

// Eventos Drag & Drop en toda la ventana y en la zona dedicada
const dropZone = document.getElementById("drop-zone");

window.addEventListener("dragover", e => {
  e.preventDefault();
  if (dropZone) dropZone.classList.add("dragover");
});
window.addEventListener("dragleave", e => {
  if (e.clientX <= 0 || e.clientY <= 0) {
    if (dropZone) dropZone.classList.remove("dragover");
  }
});
window.addEventListener("drop", async e => {
  e.preventDefault();
  if (dropZone) dropZone.classList.remove("dragover");
  if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length){
    await loadFiles(e.dataTransfer.files);
  }
});

/* 11. EXPORTAR WAV MASTERIZADO */
document.getElementById("btn-wav").addEventListener("click", async () => {
  if (AUDIO.size === 0) return alert("No hay audios cargados para generar el episodio.");
  const AC = window.AudioContext || window.webkitAudioContext;
  const ctx = new AC();
  const pieces = [];
  let maxChannels = 1;

  for (let i = 0; i < TOTAL_LINEAS; i++){
    const id = "L" + i;
    const a = AUDIO.get(id);
    if (!a) continue;
    try {
      const buf = await ctx.decodeAudioData(await a.blob.arrayBuffer());
      pieces.push(buf);
      if (buf.numberOfChannels > maxChannels) maxChannels = buf.numberOfChannels;
    } catch(e){}
  }

  if (!pieces.length) return alert("No se pudo procesar el audio.");

  const gapFrames = Math.round(ctx.sampleRate * 0.25);
  let totalLength = pieces.reduce((acc, p) => acc + p.length + gapFrames, 0);
  const outBuf = ctx.createBuffer(maxChannels, totalLength, ctx.sampleRate);

  let offset = 0;
  pieces.forEach(p => {
    for (let c = 0; c < maxChannels; c++){
      const src = p.getChannelData(Math.min(c, p.numberOfChannels - 1));
      outBuf.getChannelData(c).set(src, offset);
    }
    offset += p.length + gapFrames;
  });

  // Convertir a WAV
  const dataLen = outBuf.length * maxChannels * 2;
  const buffer = new ArrayBuffer(44 + dataLen);
  const view = new DataView(buffer);
  const writeStr = (off, s) => { for(let i=0;i<s.length;i++) view.setUint8(off+i, s.charCodeAt(i)); };
  
  writeStr(0, "RIFF"); view.setUint32(4, 36 + dataLen, true); writeStr(8, "WAVE"); writeStr(12, "fmt ");
  view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, maxChannels, true);
  view.setUint32(24, ctx.sampleRate, true); view.setUint32(28, ctx.sampleRate * maxChannels * 2, true);
  view.setUint16(32, maxChannels * 2, true); view.setUint16(34, 16, true); writeStr(36, "data");
  view.setUint32(40, dataLen, true);

  let pcmOff = 44;
  for (let i = 0; i < outBuf.length; i++){
    for (let c = 0; c < maxChannels; c++){
      let sample = Math.max(-1, Math.min(1, outBuf.getChannelData(c)[i]));
      view.setInt16(pcmOff, sample < 0 ? sample * 0x8000 : sample * 0x7FFF, true);
      pcmOff += 2;
    }
  }

  const blob = new Blob([buffer], { type: "audio/wav" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "Episodio_Completo_Frecuencia_Abierta.wav";
  link.click();
});
